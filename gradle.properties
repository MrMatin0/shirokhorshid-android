# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

# If you are getting "A failure occurred while executing com.android.build.gradle.tasks.PackageAndroidArtifact$IncrementalSplitterRunnable"
# error while building the project, try to increase the heap size to 2048 or 4096 MB with one of the following lines, for example:
#org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8


# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
android.useAndroidX=true

# ---------------------------------------------------------------------------
# Psiphon embedded values: build fallbacks.
#
# app/build.gradle generates EmbeddedValues.java from environment variables
# and treats PROPAGATION_CHANNEL_ID and SPONSOR_ID as required. CI supplies
# them from repository secrets; when those secrets are not configured (e.g. a
# fresh fork) the env vars arrive empty and the build fails at
# :app:generateEmbeddedValues.
#
# The generator falls back to Gradle properties when the env var is empty, so
# these placeholders keep the build green. They are the same placeholders the
# upstream open-source client ships. Set real repository secrets to override
# them: env vars always win over these values.
# ---------------------------------------------------------------------------
PSIPHON_PROPAGATION_CHANNEL_ID=FFFFFFFFFFFFFFFF
PSIPHON_SPONSOR_ID=FFFFFFFFFFFFFFFF

# Silences the AGP 8.5 warning about compileSdk 35 being untested.
android.suppressUnsupportedCompileSdk=35
