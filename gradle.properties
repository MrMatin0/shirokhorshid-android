# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.

# If you are getting "A failure occurred while executing com.android.build.gradle.tasks.PackageAndroidArtifact$IncrementalSplitterRunnable"
# error while building the project, try to increase the heap size to 2048 or 4096 MB with one of the following lines, for example:
#org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8


# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
android.useAndroidX=true

# ---------------------------------------------------------------------------
# Psiphon embedded values: build fallbacks.
#
# app/build.gradle generates EmbeddedValues.java from environment variables,
# falling back to the properties below when a variable is unset or empty. CI
# supplies the variables from repository secrets, so real secrets always win;
# these values only keep an unconfigured checkout (or fork) buildable and,
# more importantly, connectable.
#
# PROPAGATION_CHANNEL_ID and SPONSOR_ID are treated as required by the
# generator. The remote server list URL and signature key are Psiphon's
# public ones, as shipped in the open source clients: with them the client
# can refresh its server list at runtime instead of relying solely on the
# entries embedded at build time by scripts/fetch_server_list.py.
# ---------------------------------------------------------------------------
PSIPHON_PROPAGATION_CHANNEL_ID=FFFFFFFFFFFFFFFF
PSIPHON_SPONSOR_ID=FFFFFFFFFFFFFFFF

# TransferURLs JSON. The URL field is base64 encoded, which is what
# tunnel-core expects; it decodes to
# https://s3.amazonaws.com//psiphon/web/mjr4-p23r-puwl/server_list_compressed
PSIPHON_REMOTE_SERVER_LIST_URLS_JSON=[{"URL":"aHR0cHM6Ly9zMy5hbWF6b25hd3MuY29tLy9wc2lwaG9uL3dlYi9tanI0LXAyM3ItcHV3bC9zZXJ2ZXJfbGlzdF9jb21wcmVzc2Vk","OnlyAfterAttempts":0}]

PSIPHON_REMOTE_SERVER_LIST_SIGNATURE_PUBLIC_

# Silences the AGP 8.5 warning about compileSdk 35 being untested.
android.suppressUnsupportedCompileSdk=35
