# Version of record for this repository.
#
# VERSION_NAME is CalVer (YYYY.MM.DD) and is what CI releases when no explicit
# version is requested on the workflow. VERSION_CODE is only used by local /
# offline builds; CI derives its own from the name plus the run number so that
# every release build is monotonically newer than the last.
#
# Bump both when cutting a release.
VERSION_NAME=2026.08.21
VERSION_CODE=2026082100
